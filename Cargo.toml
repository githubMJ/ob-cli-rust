[package]
name = "ob-cli-rust"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "High-performance CLI + MCP server for Obsidian vaults"

[lib]
name = "notesmd_rs"
path = "src/lib.rs"

[dependencies]
regex = "1"

[profile.release]
opt-level = 3
lto = true
strip = true

[[bin]]
name = "ob-search"
path = "src/bin/ob_search.rs"

[[bin]]
name = "ob-ops"
path = "src/bin/ob_ops.rs"

[[bin]]
name = "ob-cli"
path = "src/bin/ob_cli.rs"
